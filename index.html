<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="An iOS-style alarm chaos simulator with overlapping alarm cards and bundled audio." />
  <title>iOS Alarm Chaos Simulator</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="js/audio.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="relative w-screen h-screen bg-black">
  <div id="chaos-viewport" aria-label="Alarm cards"></div>

  <div class="fixed bottom-4 inset-x-0 mx-auto w-fit max-w-[94vw] z-[99999] pointer-events-auto">
    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 bg-[#161618]/85 backdrop-blur-2xl border border-white/15 px-3.5 py-2.5 rounded-full shadow-[0_12px_45px_rgba(0,0,0,0.85)]">
      <button id="btn-reorder" class="flex items-center space-x-1.5 px-3 py-1.5 bg-white/10 hover:bg-white/20 active:scale-95 rounded-full text-xs font-semibold tracking-wide transition-all">
        <span class="whitespace-nowrap">重排布局</span>
      </button>
      <button id="btn-auto-flicker" class="flex items-center space-x-1.5 px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 rounded-full text-xs font-semibold text-white tracking-wide shadow-md transition-all">
        <span id="flicker-dot" class="inline-block w-2 h-2 rounded-full bg-white animate-pulse"></span>
        <span id="flicker-text" class="whitespace-nowrap">自动疯闪: 开</span>
      </button>
      <button id="btn-audio" class="flex items-center space-x-1.5 px-3 py-1.5 bg-white/10 hover:bg-white/20 active:scale-95 rounded-full text-xs font-semibold transition-all">
        <span id="audio-text" class="whitespace-nowrap">Radar: 关</span>
      </button>
      <div class="hidden sm:flex items-center space-x-2 pl-2 border-l border-white/10 text-xs text-neutral-300">
        <span class="text-[11px] text-neutral-400">密度</span>
        <button id="btn-density-dec" aria-label="Decrease density" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/25 active:scale-90 flex items-center justify-center font-bold text-xs">-</button>
        <span id="card-counter" class="font-mono text-emerald-400 text-xs w-6 text-center">85</span>
        <button id="btn-density-inc" aria-label="Increase density" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/25 active:scale-90 flex items-center justify-center font-bold text-xs">+</button>
      </div>
    </div>
  </div>
</body>
</html>
